name: tagpr

# tagpr keeps a release pull request up to date with what is merged into main
# (CHANGELOG.md and the version in version.go). Merging it tags the release,
# which the release workflow then publishes.
on:
  push:
    branches: [main]

permissions: {}

# No concurrency group: tagpr tags the release only in the run of the merge
# commit of its pull request, and a group would let a later push replace that
# run while it is pending, so that the release never happens. Overlapping
# runs at worst update the release pull request twice. (`queue: max` would
# keep them in order, but actionlint 1.7.12 does not know it yet.)

jobs:
  tagpr:
    name: tagpr
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the release branch and the tag
      pull-requests: write # open and update the release pull request
      issues: write # create the labels of the release pull request
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          # tagpr pushes the release branch and the tag with git.
          persist-credentials: true # zizmor: ignore[artipacked]
      - id: tagpr
        uses: Songmu/tagpr@v1.21.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: release
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    # What the release job of release.yml needs.
    permissions:
      contents: write # create the GitHub release and upload its archives
      packages: write # push the image to ghcr.io
      id-token: write # sign the build provenance attestation
      attestations: write # store the attestation
    # See release.yml for ./ rather than $/.
    uses: ./.github/workflows/release.yml # zizmor: ignore[self-repository]
    with:
      tag: ${{ needs.tagpr.outputs.tag }}
