name: release

# Releases a tag vX.Y.Z: CI runs on the tagged commit, then GoReleaser builds
# the archives and the multi-platform image, publishes the GitHub release,
# pushes the image to ghcr.io, and the archives get a signed build provenance
# attestation.
#
# The tagpr workflow calls this one with the tag it created, because a tag
# pushed with GITHUB_TOKEN triggers no workflow; a tag pushed by hand (a
# pre-release such as v1.2.3-rc.1 too) runs it directly. Running it by hand
# (workflow_dispatch) releases an existing tag again: after a failure, the
# assets already uploaded are replaced (release.replace_existing_artifacts
# in .goreleaser.yaml; the archives are reproducible).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  workflow_call:
    inputs:
      tag:
        description: The tag to release (vX.Y.Z)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to release (vX.Y.Z or vX.Y.Z-rc.N)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    # A reusable workflow called with ./ comes from the calling commit, as
    # $/ would bring nothing more (and actionlint does not know it yet).
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    with:
      ref: ${{ inputs.tag || github.ref }}
      release: true

  release:
    name: release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release and upload its archives
      packages: write # push the image to ghcr.io
      id-token: write # get the Sigstore certificate that signs the attestation
      attestations: write # store the attestation
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          # GoReleaser derives the version and the changelog from the git
          # history, which a shallow clone would truncate.
          fetch-depth: 0
          # GoReleaser publishes through the API and never pushes with git.
          persist-credentials: false

      - name: The tag is a semantic version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a tag vX.Y.Z or vX.Y.Z-PRERELEASE"
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Published binaries are built without a cache another workflow run
          # could have written (cache poisoning).
          cache: false

      # The image copies in the prebuilt binaries, so no emulation is needed;
      # buildx is here for the multi-platform push.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}

      - name: List the subjects of the attestation
        # Every archive, and the checksums file itself.
        run: |
          checksums=$(ls dist/*_checksums.txt)
          cp "$checksums" "$RUNNER_TEMP/subjects.txt"
          (cd dist && sha256sum "$(basename "$checksums")") >>"$RUNNER_TEMP/subjects.txt"
          cat "$RUNNER_TEMP/subjects.txt"

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/subjects.txt
